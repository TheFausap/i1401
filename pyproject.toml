[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "i1401"
version = "0.1.0"
description = "Instruction-level IBM 1401 simulator with faithful signed decimal arithmetic"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "i1401 contributors"}]
keywords = ["IBM 1401", "emulator", "simulator", "BCD", "decimal arithmetic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Emulators",
]
dependencies = []

[project.scripts]
i1401 = "ibm1401.cli:main"

[tool.setuptools.packages.find]
include = ["ibm1401*"]
